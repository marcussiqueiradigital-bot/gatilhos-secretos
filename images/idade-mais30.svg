<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><defs>
<linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff2a3d"/><stop offset="1" stop-color="#b3000f"/></linearGradient>
<linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1c1c"/><stop offset="1" stop-color="#0b0b0b"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#e50914" stop-opacity=".45"/><stop offset="1" stop-color="#e50914" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".7"/></filter>
<filter id="rg" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#ff2a3d" flood-opacity=".8"/></filter>
</defs><circle cx="100" cy="100" r="100" fill="url(#red)"/><circle cx="100" cy="100" r="100" fill="url(#glow)"/><text x="100" y="128" font-family="Nunito,Arial Black,Arial,Helvetica,sans-serif" font-size="90" font-weight="400" fill="#fff" text-anchor="middle" >👩</text></svg>